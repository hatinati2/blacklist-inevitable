name: Generate dependency lockfiles

on:
  push:
    branches:
      - chore/lock-dependency-files

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Generate npm lockfile
        run: npm install --include=optional

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Commit lockfiles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore: commit dependency lockfiles"
          git push origin HEAD:chore/lock-dependency-files
