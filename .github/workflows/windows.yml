name: Windows build

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm install --include=optional

      - name: Verify Tauri Windows CLI binding
        run: npm ls @tauri-apps/cli @tauri-apps/cli-win32-x64-msvc

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: blacklist-inevitable-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
