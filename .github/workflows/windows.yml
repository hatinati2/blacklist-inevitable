name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Verify Tauri Windows CLI binding
        run: npm ls @tauri-apps/cli @tauri-apps/cli-win32-x64-msvc

      - name: Download and verify pinned sing-box config validator
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-windows-amd64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-validator"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df"
          if ($actual -ne $expected) { throw "The sing-box v1.14.4 archive failed SHA-256 verification." }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Get-ChildItem -Path $extract -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          $runtime = Get-ChildItem -Path $extract -Filter "libcronet.dll" -Recurse | Select-Object -First 1
          if (-not $binary -or -not $runtime) { throw "The official Windows archive is missing sing-box.exe or libcronet.dll." }
          $version = (& $binary.FullName version | Out-String)
          if ($version -notmatch "1\.14\.4") { throw "The config validator reports an unexpected sing-box version: $version" }
          "SING_BOX_VALIDATOR=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build frontend
        run: npm run build

      - name: Verify locked release dependency graph
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build dedicated Windows Agent service host
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin blacklist-inevitable-agent

      - name: Sign Agent service when release signing is configured
        shell: pwsh
        env:
          AGENT_SIGNER_THUMBPRINT: ${{ vars.AGENT_SIGNER_THUMBPRINT }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $thumbprint = ($env:AGENT_SIGNER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $pfxBase64 = $env:WINDOWS_SIGNING_PFX_BASE64
          $pfxPassword = $env:WINDOWS_SIGNING_PFX_PASSWORD
          if ([string]::IsNullOrWhiteSpace($thumbprint) -and [string]::IsNullOrWhiteSpace($pfxBase64) -and [string]::IsNullOrWhiteSpace($pfxPassword)) {
            "AGENT_SIGNING_CONFIGURED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "No release signing certificate is configured; the installer will leave the privileged Agent unregistered."
            exit 0
          }
          if ($thumbprint -notmatch '^[A-F0-9]{40}
        run: npm run tauri -- build


      - name: Sign Windows installer when release signing is configured
        if: env.AGENT_SIGNING_CONFIGURED == 'true'
        shell: pwsh
        env:
          AGENT_SIGNER_THUMBPRINT: ${{ vars.AGENT_SIGNER_THUMBPRINT }}
        run: |
          $thumbprint = ($env:AGENT_SIGNER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          $kitsRoot = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Windows Kits\10\bin"
          $signtool = Get-ChildItem -Path $kitsRoot -Filter "signtool.exe" -Recurse -ErrorAction Stop |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: blacklist-inevitable-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
 -or [string]::IsNullOrWhiteSpace($pfxBase64) -or [string]::IsNullOrWhiteSpace($pfxPassword)) {
            throw "Configure AGENT_SIGNER_THUMBPRINT, WINDOWS_SIGNING_PFX_BASE64, and WINDOWS_SIGNING_PFX_PASSWORD together."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "blacklist-agent-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($pfxBase64))
            $securePassword = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
            Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword | Out-Null

            $certificate = Get-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -ErrorAction Stop
            if ($certificate.Thumbprint -ne $thumbprint -or -not $certificate.HasPrivateKey) {
              throw "The imported code-signing certificate does not match the configured publisher thumbprint or has no private key."
            }

            $kitsRoot = Join-Path ([Environment]::GetEnvironmentVariable("ProgramFiles(x86)")) "Windows Kits\10\bin"
            $signtool = Get-ChildItem -Path $kitsRoot -Filter "signtool.exe" -Recurse -ErrorAction Stop |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe
        run: npm run tauri -- build

      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: blacklist-inevitable-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
 } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }

            $agentPath = Join-Path $PWD "src-tauri\target\release\blacklist-inevitable-agent.exe"
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /sha1 $thumbprint $agentPath
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing of the Agent service failed." }

            $signature = Get-AuthenticodeSignature -FilePath $agentPath
            if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -ne $thumbprint) {
              throw "The signed Agent service did not validate against the configured publisher."
            }
            "AGENT_SIGNING_CONFIGURED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            Remove-Variable securePassword -ErrorAction SilentlyContinue
          }

      - name: Prepare pinned Agent publisher identity
        shell: pwsh
        env:
          AGENT_SIGNER_THUMBPRINT: ${{ vars.AGENT_SIGNER_THUMBPRINT }}
        run: |
          $thumbprint = ($env:AGENT_SIGNER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($env:AGENT_SIGNING_CONFIGURED -eq "true") {
            if ($thumbprint -notmatch '^[A-F0-9]{40}
        run: npm run tauri -- build

      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: blacklist-inevitable-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
