name: Windows build

on:
  push:
    branches: [main, feat/wfp-transactional-removal-smoke, feat/wfp-restricted-service-sid-probe, feat/wfp-restricted-sid-minimum-acl, feat/wfp-object-scoped-acl, feat/wfp-journaled-filter-recovery-test, feat/agent-startup-wfp-only-recovery, feat/installer-wfp-acl-provisioning]
  pull_request:
    branches: [main, feat/windows-agent-service-installer, feat/agent-credential-handoff, feat/agent-recovery-journal-bootstrap, feat/wfp-journaled-filter-recovery-test, feat/agent-startup-wfp-only-recovery, feat/installer-wfp-acl-provisioning, feat/agent-connect-engine-runtime]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Verify Tauri Windows CLI binding
        run: npm ls @tauri-apps/cli @tauri-apps/cli-win32-x64-msvc

      - name: Download and verify pinned sing-box config validator
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-windows-amd64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-validator"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df"
          if ($actual -ne $expected) { throw "The sing-box v1.14.4 archive failed SHA-256 verification." }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Get-ChildItem -Path $extract -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          $runtime = Get-ChildItem -Path $extract -Filter "libcronet.dll" -Recurse | Select-Object -First 1
          if (-not $binary -or -not $runtime) { throw "The official Windows archive is missing sing-box.exe or libcronet.dll." }
          $version = (& $binary.FullName version | Out-String)
          if ($version -notmatch "1\.14\.4") { throw "The config validator reports an unexpected sing-box version: $version" }
          "SING_BOX_VALIDATOR=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build dedicated Windows Agent service host
        env:
          BLACKLIST_AGENT_ONLY_BUILD: "1"
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --bin blacklist-inevitable-agent --bin blacklist-inevitable-wfp-acl-probe

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Run live WFP rollback-only integration smoke test
        shell: pwsh
        run: |
          $bfe = Get-Service -Name BFE -ErrorAction Stop
          if ($bfe.Status -ne [System.ServiceProcess.ServiceControllerStatus]::Running) {
            throw "The Base Filtering Engine must be running for the WFP integration smoke test."
          }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc live_bfe_transaction_tests -- --ignored --nocapture

      - name: Probe WFP access under the restricted Agent service SID
        shell: pwsh
        run: ./scripts/windows-wfp-service-sid-probe.ps1 -AgentPath "src-tauri/target/release/blacklist-inevitable-wfp-acl-probe.exe"

      - name: Upload restricted service SID WFP probe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wfp-restricted-service-sid-probe
          path: ${{ runner.temp }}/wfp-service-sid-probe.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build frontend
        run: npm run build

      - name: Verify locked release dependency graph
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Prepare fail-closed Agent publisher pin
        shell: pwsh
        run: |
          Set-Content -LiteralPath "src-tauri/windows/agent-publisher-thumbprint.txt" -Value "UNCONFIGURED" -NoNewline -Encoding ascii

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: blacklist-inevitable-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
