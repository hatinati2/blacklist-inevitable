name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Verify Tauri Windows CLI binding
        run: npm ls @tauri-apps/cli @tauri-apps/cli-win32-x64-msvc

      - name: Download and verify pinned sing-box config validator
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-windows-amd64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-validator"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df"
          if ($actual -ne $expected) { throw "The sing-box v1.14.4 archive failed SHA-256 verification." }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Get-ChildItem -Path $extract -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          $runtime = Get-ChildItem -Path $extract -Filter "libcronet.dll" -Recurse | Select-Object -First 1
          if (-not $binary -or -not $runtime) { throw "The official Windows archive is missing sing-box.exe or libcronet.dll." }
          $version = (& $binary.FullName version | Out-String)
          if ($version -notmatch "1\.14\.4") { throw "The config validator reports an unexpected sing-box version: $version" }
          "SING_BOX_VALIDATOR=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Verify preflight ACL denies a second local standard user
        shell: pwsh
        run: ./scripts/windows-preflight-acl-acceptance.ps1

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build frontend
        run: npm run build

      - name: Verify locked release dependency graph
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build dedicated Windows Agent service host
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --bin blacklist-inevitable-agent

      - name: Build Windows installer
        run: npm run tauri -- build

      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: blacklist-inevitable-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
