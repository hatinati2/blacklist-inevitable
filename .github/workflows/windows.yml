name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci --include=optional

      - name: Verify Tauri Windows CLI binding
        run: npm ls @tauri-apps/cli @tauri-apps/cli-win32-x64-msvc

      - name: Bootstrap external binary path for Rust build scripts
        shell: pwsh
        run: |
          $destinationDirectory = "src-tauri/binaries"
          $destination = Join-Path $destinationDirectory "blacklist-inevitable-agent-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
          Copy-Item -LiteralPath "$env:SystemRoot\\System32\\where.exe" -Destination $destination -Force
          if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) { throw "Could not bootstrap the external binary path required by tauri-build." }

      - name: Download and verify pinned sing-box config validator
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-windows-amd64.zip"
          $extract = Join-Path $env:RUNNER_TEMP "sing-box-1.14.4-validator"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df"
          if ($actual -ne $expected) { throw "The sing-box v1.14.4 archive failed SHA-256 verification." }
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Get-ChildItem -Path $extract -Filter "sing-box.exe" -Recurse | Select-Object -First 1
          $runtime = Get-ChildItem -Path $extract -Filter "libcronet.dll" -Recurse | Select-Object -First 1
          if (-not $binary -or -not $runtime) { throw "The official Windows archive is missing sing-box.exe or libcronet.dll." }
          $version = (& $binary.FullName version | Out-String)
          if ($version -notmatch "1\.14\.4") { throw "The config validator reports an unexpected sing-box version: $version" }
          "SING_BOX_VALIDATOR=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify pinned Iran rule-set assets with SHA-256 and sing-box
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $revision = "1597f121656f3e63f2624a471401002941d888c4"
          $directory = Join-Path $env:RUNNER_TEMP "blacklist-inevitable-pinned-rule-sets"
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $assets = @(
            @{
              Name = "geoip-ir"
              Url = "https://raw.githubusercontent.com/Chocolate4U/Iran-sing-box-rules/$revision/geoip-ir.srs"
              Length = 14288
              Sha256 = "2c32f50294216355ba41a2defb6c8d9896903ef07837668f5002f53f2cd8912c"
            },
            @{
              Name = "geosite-ir"
              Url = "https://raw.githubusercontent.com/Chocolate4U/Iran-sing-box-rules/$revision/geosite-ir.srs"
              Length = 310185
              Sha256 = "59ad4f15d78b27017315da1de79ebb3250ad1ba7a870b2424319285f7864cbe0"
            }
          )
          foreach ($asset in $assets) {
            $path = Join-Path $directory ($asset.Name + ".srs")
            Invoke-WebRequest -Uri $asset.Url -OutFile $path -MaximumRedirection 0
            $actualLength = (Get-Item -LiteralPath $path).Length
            $actualHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualLength -ne $asset.Length) { throw "$($asset.Name) has an unexpected byte length." }
            if ($actualHash -ne $asset.Sha256) { throw "$($asset.Name) failed its pinned SHA-256 check." }
            $stream = [IO.File]::OpenRead($path)
            try {
              $header = New-Object byte[] 4
              if ($stream.Read($header, 0, 4) -ne 4 -or $header[0] -ne 0x53 -or $header[1] -ne 0x52 -or $header[2] -ne 0x53 -or $header[3] -ne 0x01) {
                throw "$($asset.Name) does not have the SRS binary header."
              }
            } finally {
              $stream.Dispose()
            }
          }

          $config = @{
            outbounds = @(@{ type = "direct"; tag = "direct" })
            route = @{
              final = "direct"
              rule_set = @(
                @{ type = "local"; tag = "geoip-ir"; format = "binary"; path = (Join-Path $directory "geoip-ir.srs") },
                @{ type = "local"; tag = "geosite-ir"; format = "binary"; path = (Join-Path $directory "geosite-ir.srs") }
              )
            }
          } | ConvertTo-Json -Depth 8
          $configPath = Join-Path $directory "validate-rulesets.json"
          [IO.File]::WriteAllText($configPath, $config, [Text.UTF8Encoding]::new($false))
          & $env:SING_BOX_VALIDATOR check -c $configPath
          if ($LASTEXITCODE -ne 0) { throw "sing-box rejected the pinned Iran SRS rule-set assets." }

      - name: Format Rust sources
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Check Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build frontend
        run: npm run build

      - name: Verify locked release dependency graph
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build dedicated Windows Agent service host
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --bin blacklist-inevitable-agent

      - name: Stage Agent sidecar for NSIS
        shell: pwsh
        run: |
          $source = "src-tauri/target/x86_64-pc-windows-msvc/release/blacklist-inevitable-agent.exe"
          $destinationDirectory = "src-tauri/binaries"
          $destination = Join-Path $destinationDirectory "blacklist-inevitable-agent-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) { throw "The dedicated Agent binary was not built: $source" }
          New-Item -ItemType Directory -Path $destinationDirectory -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force
          if (-not (Test-Path -LiteralPath $destination -PathType Leaf)) { throw "The Agent sidecar could not be staged for Tauri." }
          $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          $destinationHash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash
          if ($sourceHash -ne $destinationHash) { throw "The packaged sidecar is not byte-identical to the freshly built Agent executable." }

      - name: Build desktop executable for NSIS without bundling
        # Build once; sign the resulting PE before the separate bundle command.
        run: npm run tauri -- build --no-bundle

      - name: Create trusted CI code-signing certificate
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate -Subject "CN=Blacklist Inevitable CI" -Type CodeSigningCert -CertStoreLocation "Cert:\CurrentUser\My"
          if (-not $certificate) { throw "Could not create the CI code-signing certificate." }
          $certificateFile = Join-Path $env:RUNNER_TEMP "agent-ci-code-signing.cer"
          Export-Certificate -Cert $certificate -FilePath $certificateFile -Force | Out-Null
          $root = Import-Certificate -CertStoreLocation "Cert:\LocalMachine\Root" -FilePath $certificateFile
          if (-not $root) { throw "Could not trust the ephemeral CI code-signing certificate." }
          $agent = "src-tauri/binaries/blacklist-inevitable-agent-x86_64-pc-windows-msvc.exe"
          # Tauri stages externalBin into target/release under its runtime filename.
          # The NSIS bundle consumes that staged copy, not the source triple-suffixed file.
          $stagedAgent = "src-tauri/target/release/blacklist-inevitable-agent.exe"
          $desktop = "src-tauri/target/release/blacklist-inevitable.exe"
          foreach ($binary in @($agent, $stagedAgent, $desktop)) {
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing binary to sign: $binary" }
            $signature = Set-AuthenticodeSignature -FilePath $binary -Certificate $certificate -HashAlgorithm SHA256
            if ($signature.Status -ne "Valid") { throw "Could not create a valid Authenticode signature for $binary (status: $($signature.Status))." }
          }
          $agentSignature = Get-AuthenticodeSignature -LiteralPath $agent
          $stagedAgentSignature = Get-AuthenticodeSignature -LiteralPath $stagedAgent
          $desktopSignature = Get-AuthenticodeSignature -LiteralPath $desktop
          $sameSigner = $agentSignature.SignerCertificate.Thumbprint -eq $stagedAgentSignature.SignerCertificate.Thumbprint -and $agentSignature.SignerCertificate.Thumbprint -eq $desktopSignature.SignerCertificate.Thumbprint
          if ($agentSignature.Status -ne "Valid" -or $stagedAgentSignature.Status -ne "Valid" -or $desktopSignature.Status -ne "Valid" -or -not $sameSigner) {
            throw "The source Agent, Tauri-staged Agent, and desktop executables must all have valid signatures from the same trusted signer."
          }

      - name: Bundle Windows installer
        # Bundle the already-built and signed PE files without recompiling or patching them.
        run: npm run tauri -- bundle --no-binary-patching

      - name: Verify Authenticode signatures after Tauri bundling
        shell: pwsh
        run: |
          $agent = "src-tauri/binaries/blacklist-inevitable-agent-x86_64-pc-windows-msvc.exe"
          $desktop = "src-tauri/target/release/blacklist-inevitable.exe"
          $agentSignature = Get-AuthenticodeSignature -LiteralPath $agent
          $desktopSignature = Get-AuthenticodeSignature -LiteralPath $desktop
          if ($agentSignature.Status -ne "Valid") { throw "The Agent signature is not valid after Tauri bundling: $($agentSignature.Status)." }
          if ($desktopSignature.Status -ne "Valid") { throw "The desktop signature is not valid after Tauri bundling: $($desktopSignature.Status)." }
          if ($agentSignature.SignerCertificate.Thumbprint -ne $desktopSignature.SignerCertificate.Thumbprint) {
            throw "Tauri bundling left the Agent and desktop executables with different signers."
          }

      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: blacklist-inevitable-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
