[package]
name = "blacklist-inevitable"
version = "0.1.0"
description = "Windows-first multi-engine desktop client"
authors = ["blacklist-inevitable contributors"]
edition = "2021"

[lib]
name = "blacklist_inevitable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
base64 = "0.22"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tokio = { version = "1", features = ["fs", "net", "process", "rt", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1", "windows-native-keyring-store"] }
